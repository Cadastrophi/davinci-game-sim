name: Agent task
description: Record a scoped task and its acceptance evidence
title: "[Task]: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible or system outcome, not an implementation guess.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what is included and explicitly excluded.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Human owner and agent
      placeholder: "Justin / Codex"
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Planned branch
      placeholder: "Cadastrophi_short-slug"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Expected paths and interfaces
      description: List likely files, scenes, prefabs, settings, schemas, or public contracts.
    validations:
      required: true
  - type: textarea
    id: related_work
    attributes:
      label: Related work
      description: Link relevant issues/PRs and describe actual dependencies.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Tests, manual checks, screenshots, or measurable criteria.
    validations:
      required: true
