<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arm study · Approval preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae4;color:#252a2e;font:14px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;outline:none;touch-action:none}header{position:absolute;top:32px;left:36px;pointer-events:none}header small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#777}h1{font-size:28px;font-weight:500;letter-spacing:-1px;margin:10px 0}header p{color:#777;font-size:13px}footer{position:absolute;bottom:28px;left:36px;right:36px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{border:1px solid #c8c4bd;background:#fff9;border-radius:8px;padding:10px 14px;color:#343b3e;cursor:pointer}button:hover{background:white}label{background:#fff9;padding:9px 12px;border-radius:8px;font-size:12px}input{vertical-align:middle;width:95px}#note{margin-left:auto;color:#74716c;font-size:12px}
</style></head><body>
<canvas id="model" aria-label="Interactive 3D surgical grasper design preview"></canvas>
<header><small>Design study 02 / actual 3D geometry</small><h1>Wristed surgical grasper</h1><p id="view-label">First-person · open jaws</p></header>
<footer><button id="first">First-person</button><button id="detail">Wrist close-up</button><button id="side">Side profile</button><label>Jaw opening <input id="jaw" aria-label="Jaw opening" type="range" min="0" max="30" value="16"></label><label>Wrist bend <input id="bend" aria-label="Wrist bend" type="range" min="-25" max="25" value="0"></label><button id="background">Cavity backdrop</button><span id="note">Drag to inspect · scroll to zoom · awaiting design approval</span></footer>
<script type="module" src="/design-preview/arm.js"></script></body></html>
